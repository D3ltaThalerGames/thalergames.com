
# Project information
site_name: thalergames.com - Game Blog
site_url: https://thalergames.com
site_author: D3lta
site_description: >-
  A blog about games, game development, and related topics.
theme:
  name: material
  logo: assets/thalergames_logo.png
  language: de
  custom_dir: overrides
  features:
    #- navigation.instant
    #- navigation.instant.progress
    #- navigation.tracking
    - navigation.tabs
    #- navigation.tabs.sticky
    #- navigation.sections
    #- navigation.expand
    - navigation.indexes
    #- toc.follow
    #- toc.integrate
    #- navigation.top
    - content.tabs.link
    - content.code.copy
    - content.action.view
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css
  - https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css
  - https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css
  - stylesheets/thalergames.css

extra_javascript:
  - https://code.jquery.com/jquery-3.7.0.min.js
  - https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js
  - https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js
  - https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js
  - https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js
  - javascripts/datatables-init.js
  - javascripts/dynamic-datatables.js
  - javascripts/tablesorts.js

plugin:
  - meta
  - blog:
      blog_toc: true
      archive_date_format: MMMM yyyy
      categories_allowed:
        - Games
        - Lanparty
  - search
  - tags

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - index.md
  - Games:
    - games/index.md
  - Charts: charts.md
  - Blog:
    - blog/index.md
